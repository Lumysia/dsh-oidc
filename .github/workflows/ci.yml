name: ci

on:
  push:
  pull_request:
  # Weekly run against the newest DSH release, so an upstream break shows up
  # even when this repository has not changed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: DSH version or dist-tag for the acceptance test
        required: false
        default: latest

permissions:
  contents: read

env:
  CADDY_VERSION: 2.10.2

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run pack:check
      - run: npm run secret:scan

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Caddy (checksum-verified release binary)
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/caddy_${CADDY_VERSION}_checksums.txt" | grep " ${archive}\$" | sha512sum -c -
          tar -xzf "$archive" caddy
          ./caddy version
      - name: Real-stack acceptance (Caddy + DSH + synthetic OIDC + Chromium)
        env:
          DSH_OIDC_CADDY_BIN: ${{ runner.temp }}/caddy
          DSH_OIDC_DSH_VERSION: ${{ inputs.dsh_version || 'latest' }}
        run: npm run test:acceptance
