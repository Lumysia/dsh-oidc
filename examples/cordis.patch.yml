# Add this top-level patch to a DSH Web profile (DSH 0.2.1 or newer).
# The Base and Web bundles keep ownership of credentials, webServer, runtime,
# and Connection; this only adds the OIDC plugin row.
#
# DSH Web prints a bearer bootstrap URL at startup by default and --no-open
# does NOT suppress it. A patch row replaces the row's whole config, so the
# web-runtime row below restates upstream's values and only flips printUrl.
# Connection is still owned by `@deepseek-ai/dsh-client-connection`; supply the
# public authority with `dsh --profile web --trusted-host dsh.example`.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: false
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: true
- insert:
    - id: lumysia-oidc
      name: '@lumysia/dsh-oidc'
      inject: [webServer, connection, credentials]
      config:
        issuer: !!js process.env.DSH_OIDC_ISSUER
        clientId: !!js process.env.DSH_OIDC_CLIENT_ID
        clientSecretRef: !!js process.env.DSH_OIDC_CLIENT_SECRET_REF
        publicOrigin: !!js process.env.DSH_OIDC_PUBLIC_ORIGIN
        allowedSubjects: !!js JSON.parse(process.env.DSH_OIDC_ALLOWED_SUBJECTS || '[]')
        # Socket addresses allowed to set X-Dsh-Oidc-Client-Ip. Default is
        # loopback only; set it when Caddy reaches DSH over a container network.
        trustedProxies: !!js JSON.parse(process.env.DSH_OIDC_TRUSTED_PROXIES || '["127.0.0.0/8","::1"]')
        groupMode: any
