# DSH behind nginx, with the same rules as examples/Caddyfile.
#
# This file goes inside the http {} block, for example as
# /etc/nginx/conf.d/dsh.conf. It needs nginx 1.25.1 or newer built with
# ngx_http_auth_request_module (the nginx.org packages and most distribution
# packages include it; check with `nginx -V`).
#
# Illustrative HTTPS-only host: there is no `listen 80` here on purpose. Use
# DNS-01 or operator-managed certificates, and block TCP/80 for this address
# at the network edge. If another server block listens on port 80 on the same
# IP, this host is not strictly HTTPS-only.

# If DSH runs in another container, point this at it and set the plugin's
# trustedProxies to this proxy's address or network.
upstream dsh_oidc {
    server 127.0.0.1:3080;
}

# Keep the WebSocket upgrade on the application proxy only.
map $http_upgrade $dsh_oidc_connection {
    default upgrade;
    ''      close;
}

# DSH's temporary native bootstrap URL carries a bearer token in its query, so
# the access log records $uri (path only), never $request or $request_uri.
log_format dsh_oidc '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

# Refuse TLS for any other name, so stray SNI or Host values never reach DSH.
# Drop this block if you already have a default_server on port 443.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dsh.example;

    ssl_certificate     /etc/ssl/dsh.example/fullchain.pem;
    ssl_certificate_key /etc/ssl/dsh.example/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/dsh.access.log dsh_oidc;
    # nginx writes the full request line, query included, into error log
    # entries such as an unreachable upstream. Keep this log private, or
    # raise its level to crit to leave those entries out.
    error_log /var/log/nginx/dsh.error.log;

    # DSH sets Secure on its native cookie only when DSH itself serves TLS,
    # not behind this proxy over plain HTTP. Add it to every dsh-auth-*
    # cookie (once, also on deletions). nginx cannot change cookies that a
    # browser already holds.
    proxy_cookie_flags ~^dsh-auth- secure;

    # Uploads and streams go straight through; DSH applies its own limits.
    client_max_body_size 0;
    proxy_http_version 1.1;

    # Headers for every request to DSH. Browser-supplied credentials, proxy
    # credentials, identity aliases and the client address header are
    # removed (an empty value means "do not send"), and the client address
    # header is set from the TCP connection. WebSocket upgrades pass through.
    #
    # nginx drops all of these in any location that sets a proxy_set_header
    # of its own. Only the check subrequest below does, and it repeats the
    # list; keep the two the same.
    proxy_set_header Host                 $host;
    proxy_set_header X-Dsh-Oidc-Client-Ip $remote_addr;
    proxy_set_header X-Forwarded-For      $remote_addr;
    proxy_set_header X-Forwarded-Proto    $scheme;
    proxy_set_header X-Forwarded-Host     $host;
    proxy_set_header Authorization        "";
    proxy_set_header Proxy-Authorization  "";
    proxy_set_header X-Forwarded-User     "";
    proxy_set_header X-Forwarded-Email    "";
    proxy_set_header X-Auth-Request-User  "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Remote-User        "";
    proxy_set_header Remote-User          "";
    proxy_set_header Upgrade              $http_upgrade;
    proxy_set_header Connection           $dsh_oidc_connection;

    # Only the five registered OIDC endpoints bypass admission. Each one is
    # an exact match and passes the normalized path, so DSH sees exactly the
    # path nginx matched.
    location = /auth/login    { proxy_pass http://dsh_oidc/auth/login; }
    location = /auth/callback { proxy_pass http://dsh_oidc/auth/callback; }
    location = /auth/check    { proxy_pass http://dsh_oidc/auth/check; }
    location = /auth/signin   { proxy_pass http://dsh_oidc/auth/signin; }
    location = /auth/logout   { proxy_pass http://dsh_oidc/auth/logout; }

    # Do not let a future DSH route under /auth/ inherit the exception.
    location /auth/ {
        return 404;
    }

    # The admission subrequest. `internal` makes it unreachable from outside.
    # It is a GET without the request body, and with the upgrade headers
    # removed so a WebSocket request is checked as a plain GET.
    location = /_dsh_oidc_check {
        internal;
        proxy_pass http://dsh_oidc/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;

        # Same list as the server level, with the upgrade and body removed.
        proxy_set_header Host                 $host;
        proxy_set_header X-Dsh-Oidc-Client-Ip $remote_addr;
        proxy_set_header X-Forwarded-For      $remote_addr;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;
        proxy_set_header Authorization        "";
        proxy_set_header Proxy-Authorization  "";
        proxy_set_header X-Forwarded-User     "";
        proxy_set_header X-Forwarded-Email    "";
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Remote-User        "";
        proxy_set_header Remote-User          "";
        proxy_set_header Upgrade              "";
        proxy_set_header Connection           "";
        proxy_set_header Content-Length       "";
    }

    # Everything else (root, assets, /api, uploads, SSE, WebSocket upgrades,
    # /_dsh-oidc/session) needs a passing /auth/check first.
    #
    # auth_request admits on 2xx and returns 401 or 403 as they are. Any
    # other answer, including the 303 that sends a browser navigation to the
    # sign-in page, a 404 from a disabled plugin, a 5xx, or an unreachable
    # DSH, becomes a 500. @dsh_oidc_denied turns the 303 back into a redirect
    # and leaves everything else a 500, so every failure denies.
    location / {
        auth_request /_dsh_oidc_check;
        auth_request_set $dsh_oidc_location $upstream_http_location;
        error_page 500 = @dsh_oidc_denied;

        proxy_pass http://dsh_oidc;

        # Streams (SSE, long responses) and uploads are passed through
        # without buffering; long-lived WebSocket and SSE connections get an
        # hour of idle time instead of nginx's 60 seconds.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location @dsh_oidc_denied {
        absolute_redirect off;
        if ($dsh_oidc_location ~ ^/auth/(signin|login\?nav=1)$) {
            return 303 $dsh_oidc_location;
        }
        return 500;
    }
}
